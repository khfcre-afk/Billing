openapi: 3.1.0
info:
  title: Pterodactyl Billing API
  version: 0.1.0
  description: |
    Billing platform for Pterodactyl Panel with promo-code-only top-ups.
    Money-in payment gateways are intentionally disabled.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200": { description: OK }
  /api/auth/register:
    post:
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201": { description: Created }
  /api/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200": { description: OK }
  /api/auth/refresh:
    post:
      summary: Refresh tokens
      responses:
        "200": { description: OK }
  /api/auth/logout:
    post:
      summary: Logout
      responses:
        "204": { description: No Content }
  /api/users/me:
    get:
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
  /api/tariffs:
    get:
      summary: List active tariffs (public)
      responses:
        "200": { description: OK }
  /api/tariffs/{id}/purchase:
    post:
      summary: Purchase a tariff (debits balance, provisions server)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Created }
        "400": { description: Insufficient balance or inactive tariff }
  /api/promo/redeem:
    post:
      summary: Redeem a promo code
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 3, maxLength: 64 }
      responses:
        "200": { description: OK }
        "409": { description: Already used }
  /api/servers:
    get:
      summary: List my servers
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
  /api/servers/{id}/power:
    post:
      summary: Send power signal to a server
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signal]
              properties:
                signal:
                  type: string
                  enum: [start, stop, restart, kill]
      responses:
        "204": { description: No Content }
  /api/transactions:
    get:
      summary: List my transactions
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
  /api/admin/promo:
    get:
      summary: Admin list promo codes
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
    post:
      summary: Admin create promo code
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Created }
  /api/admin/tariffs:
    post:
      summary: Admin create tariff
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Created }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
